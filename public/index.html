<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Felarumi</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="home" hidden>
    <header class="home-bar">
      <img class="home-logo" src="/logo.png" alt="Felarumi">
      <a class="sheets-home" href="/sheets">Felanumio</a>
    </header>
    <main class="home-main">
      <button type="button" id="blank" class="blank-card">
        <span class="material-symbols-outlined">add</span>
        <span>Blank document</span>
      </button>
      <h2>Recent documents</h2>
      <ul id="recent"></ul>
      <h2>Trash</h2>
      <ul id="trash"></ul>
    </main>
  </div>

  <div id="editor" hidden>
    <header class="topbar">
      <a class="mark-link" href="/" aria-label="Felarumi home"><img class="header-logo" src="/logo.png" alt=""></a>
      <div class="title-block">
        <input id="title" aria-label="Document title" value="Untitled document" maxlength="200" autocomplete="off">
        <div id="status" class="status">All changes saved</div>
      </div>
      <div id="avatars" class="avatars"></div>
      <button type="button" id="name-btn" class="name-btn" title="Your name">Guest</button>
      <button type="button" id="share" class="share">Share</button>
    </header>

    <div class="menubar" id="menubar">
      <div class="menu">
        <button type="button" class="menu-btn" data-menu="file">File</button>
        <div class="menu-pop" data-pop="file" hidden>
          <button type="button" data-act="new">New</button>
          <button type="button" data-act="rename">Rename</button>
          <button type="button" data-act="makecopy">Make a copy</button>
          <div class="menu-label">Version history</div>
          <button type="button" data-act="history">See version history</button>
          <button type="button" data-act="name-version">Name current version</button>
          <div class="menu-label">Download</div>
          <button type="button" data-act="download-felarumi">Felarumi (.felarumi)</button>
          <button type="button" data-act="download-docx">Word (.docx)</button>
          <button type="button" data-act="download-odt">OpenDocument (.odt)</button>
          <button type="button" data-act="download-pdf">PDF (.pdf)</button>
          <button type="button" data-act="download-html">Web page (.html)</button>
          <button type="button" data-act="download-md">Markdown (.md)</button>
          <button type="button" data-act="download-txt">Plain text (.txt)</button>
          <button type="button" data-act="import">Open / Import</button>
          <button type="button" data-act="verify-cid">Verify from CID</button>
          <button type="button" data-act="page-setup">Page setup</button>
          <button type="button" data-act="print">Print</button>
          <button type="button" data-act="trash">Move to trash</button>
        </div>
      </div>
      <div class="menu">
        <button type="button" class="menu-btn" data-menu="edit">Edit</button>
        <div class="menu-pop" data-pop="edit" hidden>
          <button type="button" data-act="undo">Undo</button>
          <button type="button" data-act="redo">Redo</button>
          <button type="button" data-act="cut">Cut</button>
          <button type="button" data-act="copy">Copy</button>
          <button type="button" data-act="paste">Paste</button>
          <button type="button" data-act="paste-plain">Paste without formatting</button>
          <button type="button" data-act="delete">Delete</button>
          <button type="button" data-act="select-all">Select all</button>
          <button type="button" data-act="find">Find</button>
          <button type="button" data-act="replace">Find and replace</button>
        </div>
      </div>
      <div class="menu">
        <button type="button" class="menu-btn" data-menu="view">View</button>
        <div class="menu-pop" data-pop="view" hidden>
          <button type="button" data-act="zoom-in">Zoom in</button>
          <button type="button" data-act="zoom-out">Zoom out</button>
          <button type="button" data-act="zoom-100">100%</button>
          <button type="button" data-act="zoom-fit">Fit width</button>
          <button type="button" class="tog" data-act="ruler" aria-pressed="true">Show ruler</button>
          <button type="button" class="tog" data-act="outline" aria-pressed="false">Show outline</button>
          <button type="button" class="tog" data-act="invisibles" aria-pressed="false">Show non-printing characters</button>
          <button type="button" data-act="fullscreen">Full screen</button>
          <button type="button" class="tog" data-act="pageless" aria-pressed="false">Pageless</button>
          <button type="button" class="tog" data-act="compact" aria-pressed="false">Hide the menus</button>
        </div>
      </div>
      <div class="menu">
        <button type="button" class="menu-btn" data-menu="insert">Insert</button>
        <div class="menu-pop" data-pop="insert" hidden>
          <div class="menu-sub">
            <button type="button" class="sub-label">Break</button>
            <div class="menu-pop sub">
              <button type="button" data-act="page-break">Page break</button>
              <button type="button" data-act="section-next">Section break (next page)</button>
              <button type="button" data-act="section-cont">Section break (continuous)</button>
            </div>
          </div>
          <button type="button" data-act="header">Header</button>
          <button type="button" data-act="footer">Footer</button>
          <button type="button" data-act="page-number">Page number</button>
          <button type="button" data-act="footnote">Footnote</button>
          <button type="button" data-act="toc">Table of contents</button>
          <button type="button" data-act="toc-update">Update table of contents</button>
          <button type="button" data-act="bookmark">Bookmark</button>
          <button type="button" data-act="heading-link">Link to heading</button>
          <button type="button" data-act="rule">Horizontal line</button>
          <button type="button" data-act="table">Table</button>
          <button type="button" data-act="image">Image</button>
          <button type="button" data-act="equation">Equation</button>
          <button type="button" data-act="chart">Chart</button>
          <button type="button" data-act="drawing">Drawing</button>
          <button type="button" data-act="citation">Citation</button>
          <button type="button" data-act="bibliography">Bibliography</button>
          <button type="button" data-act="watermark">Watermark</button>
          <button type="button" data-act="chars">Special characters</button>
          <button type="button" data-act="link">Link</button>
          <button type="button" data-act="vote">Voting chip</button>
          <button type="button" data-act="person">Person</button>
          <button type="button" data-act="date">Date</button>
          <button type="button" data-act="dropdown">Dropdown</button>
          <button type="button" data-act="signature">Signature</button>
          <button type="button" data-act="comment">Comment</button>
        </div>
      </div>
      <div class="menu">
        <button type="button" class="menu-btn" data-menu="format">Format</button>
        <div class="menu-pop" data-pop="format" hidden>
          <div class="menu-sub">
            <button type="button" class="sub-label">Text</button>
            <div class="menu-pop sub">
              <button type="button" data-act="case-lower">lowercase</button>
              <button type="button" data-act="case-upper">UPPERCASE</button>
              <button type="button" data-act="case-title">Title Case</button>
              <button type="button" data-act="small-caps">Small caps</button>
            </div>
          </div>
          <div class="menu-sub">
            <button type="button" class="sub-label">Columns</button>
            <div class="menu-pop sub">
              <button type="button" data-act="cols-1">One</button>
              <button type="button" data-act="cols-2">Two</button>
              <button type="button" data-act="cols-3">Three</button>
            </div>
          </div>
          <button type="button" data-act="bold">Bold</button>
          <button type="button" data-act="italic">Italic</button>
          <button type="button" data-act="underline">Underline</button>
          <button type="button" data-act="strike">Strikethrough</button>
          <button type="button" data-act="sup">Superscript</button>
          <button type="button" data-act="sub">Subscript</button>
          <button type="button" data-act="h1">Heading 1</button>
          <button type="button" data-act="h2">Heading 2</button>
          <button type="button" data-act="h3">Heading 3</button>
          <button type="button" data-act="h4">Heading 4</button>
          <button type="button" data-act="h5">Heading 5</button>
          <button type="button" data-act="h6">Heading 6</button>
          <button type="button" data-act="spacing">Line and paragraph spacing</button>
          <button type="button" data-act="normal">Normal text</button>
          <button type="button" data-act="align-left">Align left</button>
          <button type="button" data-act="align-center">Align center</button>
          <button type="button" data-act="align-right">Align right</button>
          <button type="button" data-act="bullet">Bulleted list</button>
          <button type="button" data-act="numbered">Numbered list</button>
          <button type="button" data-act="check">Checklist</button>
          <button type="button" data-act="indent">Increase indent</button>
          <button type="button" data-act="outdent">Decrease indent</button>
          <button type="button" data-act="clear">Clear formatting</button>
        </div>
      </div>
      <div class="menu">
        <button type="button" class="menu-btn" data-menu="tools">Tools</button>
        <div class="menu-pop" data-pop="tools" hidden>
          <button type="button" data-act="spelling">Spelling</button>
          <button type="button" data-act="dictionary">Personal dictionary</button>
          <button type="button" data-act="lookup">Dictionary</button>
          <button type="button" data-act="compare">Compare versions</button>
          <button type="button" data-act="wordcount">Word count</button>
          <button type="button" data-act="preferences">Preferences</button>
          <button type="button" data-act="shortcuts">Keyboard shortcuts</button>
        </div>
      </div>
      <div class="menu">
        <button type="button" class="menu-btn" data-menu="extensions">Extensions</button>
        <div class="menu-pop" data-pop="extensions" hidden>
          <button type="button" data-act="addons">Add-ons</button>
        </div>
      </div>
      <div class="menu">
        <button type="button" class="menu-btn" data-menu="help">Help</button>
        <div class="menu-pop" data-pop="help" hidden>
          <button type="button" data-act="menu-search">Search the menus</button>
          <button type="button" data-act="shortcuts">Keyboard shortcuts</button>
        </div>
      </div>
    </div>

    <div class="toolbar" id="toolbar">
      <button type="button" id="undo" class="icon" title="Undo (Ctrl+Z)"><span class="material-symbols-outlined">undo</span></button>
      <button type="button" id="redo" class="icon" title="Redo (Ctrl+Y)"><span class="material-symbols-outlined">redo</span></button>
      <span class="sep"></span>
      <select id="zoom" aria-label="Zoom">
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1" selected>100%</option>
        <option value="1.25">125%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
      </select>
      <select id="style" aria-label="Style">
        <option value="normal">Normal text</option>
        <option value="title">Title</option>
        <option value="subtitle">Subtitle</option>
        <option value="h1">Heading 1</option>
        <option value="h2">Heading 2</option>
        <option value="h3">Heading 3</option>
        <option value="h4">Heading 4</option>
        <option value="h5">Heading 5</option>
        <option value="h6">Heading 6</option>
      </select>
      <select id="font" aria-label="Font">
        <option>Open Sans</option>
        <option>Roboto</option>
        <option>Lora</option>
        <option>Roboto Mono</option>
      </select>
      <select id="size" aria-label="Font size">
        <option>8</option><option>9</option><option>10</option><option>11</option><option>12</option>
        <option>14</option><option>15</option><option>16</option><option>18</option><option>20</option>
        <option>24</option><option>26</option><option>28</option><option>36</option>
      </select>
      <span class="sep"></span>
      <button type="button" id="bold" class="icon" title="Bold"><span class="material-symbols-outlined">format_bold</span></button>
      <button type="button" id="italic" class="icon" title="Italic"><span class="material-symbols-outlined">format_italic</span></button>
      <button type="button" id="underline" class="icon" title="Underline (Ctrl+U)"><span class="material-symbols-outlined">format_underlined</span></button>
      <button type="button" id="strike" class="icon" title="Strikethrough (Alt+Shift+5)"><span class="material-symbols-outlined">format_strikethrough</span></button>
      <label class="icon color-btn" title="Text color">
        <span class="material-symbols-outlined">format_color_text</span>
        <input id="color" type="color" value="#202124" aria-label="Text color">
        <i id="color-bar"></i>
      </label>
      <label class="icon color-btn" title="Highlight color">
        <span class="material-symbols-outlined">format_ink_highlighter</span>
        <input id="highlight" type="color" value="#fff59d" aria-label="Highlight color">
        <i id="highlight-bar"></i>
      </label>
      <span class="sep"></span>
      <button type="button" id="link" class="icon" title="Insert link (Ctrl+K)"><span class="material-symbols-outlined">link</span></button>
      <button type="button" id="comment" class="icon" title="Comment (Ctrl+Alt+M)"><span class="material-symbols-outlined">comment</span></button>
      <button type="button" id="signature" class="icon" title="Insert signature"><span class="material-symbols-outlined">draw</span></button>
      <button type="button" id="paint" class="icon" title="Paint format (Ctrl+Alt+C, then Ctrl+Alt+V)"><span class="material-symbols-outlined">format_paint</span></button>
      <button type="button" id="clear" class="icon" title="Clear formatting (Ctrl+\\)"><span class="material-symbols-outlined">format_clear</span></button>
      <span class="sep"></span>
      <button type="button" id="align-left" class="icon" title="Align left"><span class="material-symbols-outlined">format_align_left</span></button>
      <button type="button" id="align-center" class="icon" title="Align center"><span class="material-symbols-outlined">format_align_center</span></button>
      <button type="button" id="align-right" class="icon" title="Align right"><span class="material-symbols-outlined">format_align_right</span></button>
      <button type="button" id="align-justify" class="icon" title="Justify"><span class="material-symbols-outlined">format_align_justify</span></button>
      <button type="button" id="list-bullet" class="icon" title="Bulleted list (Ctrl+Shift+8)"><span class="material-symbols-outlined">format_list_bulleted</span></button>
      <button type="button" id="list-numbered" class="icon" title="Numbered list (Ctrl+Shift+7)"><span class="material-symbols-outlined">format_list_numbered</span></button>
      <button type="button" id="list-check" class="icon" title="Checklist (Ctrl+Shift+9)"><span class="material-symbols-outlined">checklist</span></button>
      <button type="button" id="indent" class="icon" title="Increase indent (Ctrl+])"><span class="material-symbols-outlined">format_indent_increase</span></button>
      <button type="button" id="outdent" class="icon" title="Decrease indent (Ctrl+[)"><span class="material-symbols-outlined">format_indent_decrease</span></button>
      <select id="spacing" aria-label="Line spacing">
        <option value="1">1.0</option>
        <option value="1.15" selected>1.15</option>
        <option value="1.5">1.5</option>
        <option value="2">2.0</option>
        <option value="custom">Custom</option>
      </select>
      <select id="mode" aria-label="Mode">
        <option value="edit">Editing</option>
        <option value="suggest">Suggesting</option>
        <option value="view">Viewing</option>
      </select>
    </div>
    <div id="mode-banner" hidden></div>
    <div id="sign-banner" hidden>Signed, locked for edits</div>
    <div id="findbar" hidden>
      <input id="find-q" aria-label="Find" placeholder="Find">
      <label class="find-opt"><input id="find-regex" type="checkbox">Regex</label>
      <span id="find-count"></span>
      <button type="button" id="find-prev" class="icon" title="Previous"><span class="material-symbols-outlined">keyboard_arrow_up</span></button>
      <button type="button" id="find-next" class="icon" title="Next"><span class="material-symbols-outlined">keyboard_arrow_down</span></button>
      <input id="find-repl" aria-label="Replace with" placeholder="Replace with">
      <button type="button" id="find-replace">Replace</button>
      <button type="button" id="find-all">All</button>
      <button type="button" id="find-close" class="icon" title="Close"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div id="table-tools" hidden>
      <span>Table</span>
      <button type="button" id="row-add">Add row</button>
      <button type="button" id="row-remove">Remove row</button>
      <button type="button" id="col-add">Add column</button>
      <button type="button" id="col-remove">Remove column</button>
    </div>

    <div id="print-preview" hidden>
      <strong>Print preview</strong>
      <span id="print-pages"></span>
      <button type="button" id="print-go">Print</button>
      <button type="button" id="print-close">Close</button>
    </div>
    <div id="trash-banner" hidden>
      <span>This document is in the trash.</span>
      <button type="button" id="trash-restore">Restore</button>
      <button type="button" id="trash-delete">Delete forever</button>
    </div>
    <main id="scroll">
      <div id="stack">
        <canvas id="vruler" width="28" height="1056" aria-hidden="true"></canvas>
        <canvas id="ruler" width="816" height="28" aria-hidden="true"></canvas>
        <div id="pages"></div>
        <div id="overlay"></div>
        <button type="button" id="comment-add" class="icon" title="Add comment" hidden><span class="material-symbols-outlined">add_comment</span></button>
        <div id="notes"></div>
        <div id="at-menu" hidden></div>
        <div id="link-pop" hidden>
          <input id="link-url" aria-label="Link URL" placeholder="https://">
          <button type="button" id="link-apply">Apply</button>
          <button type="button" id="link-clear">Remove</button>
          <button type="button" id="link-open">Open</button>
        </div>
      </div>
    </main>
    <div id="image-pop" hidden>
      <input id="image-url" aria-label="Image URL" placeholder="Image URL">
      <button type="button" id="image-insert">Insert</button>
      <label class="text-btn">Upload<input id="image-file" type="file" accept="image/*" hidden></label>
      <button type="button" id="image-close" class="icon" title="Close"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div id="dialog" hidden>
      <div class="dialog-card">
        <header><h2 id="dialog-title"></h2><button type="button" id="dialog-close" class="icon" title="Close"><span class="material-symbols-outlined">close</span></button></header>
        <div id="dialog-body"></div>
      </div>
    </div>
    <div id="input" contenteditable="true" role="textbox" aria-multiline="true" aria-label="Document body" spellcheck="true"></div>
    <aside id="outline" hidden>
      <header>
        <h2>Outline</h2>
        <button type="button" id="outline-close" class="icon" title="Close"><span class="material-symbols-outlined">close</span></button>
      </header>
      <ul id="outline-list"></ul>
    </aside>
    <div id="context" hidden role="menu"></div>
    <aside id="history" hidden>
      <header>
        <h2>Version history</h2>
        <button type="button" id="history-close" class="icon" title="Close"><span class="material-symbols-outlined">close</span></button>
      </header>
      <p id="history-banner" hidden></p>
      <ul id="history-list"></ul>
      <footer><button type="button" id="history-restore" hidden>Restore this version</button></footer>
    </aside>
    <input id="import-file" type="file" accept=".felarumi,.docx,.odt,.html,.htm,.md,.txt,.json" hidden>
    <div id="toast" hidden></div>
    <nav id="tabs" hidden></nav>
  </div>
  <script src="/app.js"></script>
</body>
</html>
